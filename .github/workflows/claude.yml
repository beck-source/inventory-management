name: Claude Code

# Responds to @claude mentions in issues, PR comments, and PR reviews.
# Only users with write access to the repo can trigger it (enforced by the action).
#
# Uses Claude via Microsoft Foundry (Azure) with API-key auth:
#   - Secret   ANTHROPIC_FOUNDRY_API_KEY  : Azure Foundry API key
#   - Variable ANTHROPIC_FOUNDRY_RESOURCE : Foundry resource name (the part before .services.ai.azure.com)
#   - Variable CLAUDE_MODEL (optional)    : Foundry model deployment name, e.g. claude-sonnet-4-5

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # Lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          # The action validates that a Foundry resource/URL is set, and Claude Code
          # picks up ANTHROPIC_FOUNDRY_API_KEY from the inherited environment.
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
        with:
          use_foundry: "true"
          # The Claude GitHub App is not installed (Foundry setup), so post as github-actions
          # using the workflow token instead of the app-token exchange.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Only pass --model when the CLAUDE_MODEL variable is set.
          claude_args: ${{ vars.CLAUDE_MODEL && format('--model {0}', vars.CLAUDE_MODEL) || '' }}
