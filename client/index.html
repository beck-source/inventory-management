<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factory Inventory Management System</title>
  <!-- Runs synchronously before first paint so the saved theme is applied without a flash. Keep the storage key in sync with composables/useTheme.js. -->
  <script>
    (function () {
      var pref = 'system'
      try {
        pref = localStorage.getItem('ui.theme') || 'system'
      } catch (e) {
        // Storage can throw in private mode or with blocked site data; fall back to system.
      }
      var dark = pref === 'dark' ||
        (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
